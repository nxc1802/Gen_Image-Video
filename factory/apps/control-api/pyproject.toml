[project]
name = "factory-control-api"
version = "0.1.0"
description = "Factory v4 Lite Control Plane API (Authentication, Queue, Registry, Telemetry)"
requires-python = ">=3.11"
dependencies = [
    "factory-contracts",
    "factory-auth",
    "factory-model-registry",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3.0",
    "boto3>=1.34.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_control_api"]
