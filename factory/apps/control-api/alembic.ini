# factory/apps/control-api/alembic.ini
# Alembic database migration configuration for Factory v4 Control Plane.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os

# Default fallback URL; dynamically overridden in env.py from POSTGRES_DSN / DATABASE_URL / SQLITE_DB_PATH
sqlalchemy.url = sqlite:///./factory.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
