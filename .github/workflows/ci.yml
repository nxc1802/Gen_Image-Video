name: Factory v4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  studio-web:
    name: Studio Web (Next.js 15 / React 19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: factory/apps/studio-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: factory/apps/studio-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  backend:
    name: Backend CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Synchronize workspace packages
        run: uv sync --all-packages

      - name: Set up Node.js 20 for Cross-Stack Validation
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: factory/apps/studio-web/package-lock.json

      - name: Install Studio Web dependencies for cross-stack tests
        run: npm ci
        working-directory: factory/apps/studio-web

      - name: Compile Python sources
        run: uv run python -m compileall -q factory packages services deployments

      - name: Validate Declarative Manifests
        run: uv run python -c "from model_registry.loader import ManifestLoader; ManifestLoader().load_all()"

      - name: Guard against fake inference and insecure regressions
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          roots = [Path("services"), Path("factory"), Path("deployments")]
          forbidden = {
              "_project_token_hyperplane": "pseudo embedding fallback",
              "interim_vocabulary": "canned ASR transcript",
              "_generate_png_image": "synthetic image enhancement",
              "_generate_mp4_container": "synthetic video enhancement",
              'allow_origins=["*"]': "wildcard credentialed CORS",
              "sk-factory-studio": "hardcoded frontend API token",
              "raw_val = (scale[0] + scale[1]) / 2.0": "invented decision midpoint",
              "gpu_utilization_percent=60.0": "fabricated GPU telemetry",
              "gpu_utilization_percent=55.0": "fabricated GPU telemetry",
              "vram_used_mb=4200.0": "fabricated VRAM telemetry",
              "vram_used_mb=3500.0": "fabricated VRAM telemetry",
              "mock_png =": "mock image artifact fallback",
              "mock_mp4 =": "mock video artifact fallback",
          }
          failures = []
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in {".py", ".ts", ".tsx", ".js", ".mjs"}:
                      continue
                  if any(p in {"tests", "node_modules", ".next", "dist", "build"} for p in path.parts):
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for needle, reason in forbidden.items():
                      if needle in text:
                          failures.append(f"{path}: {reason} ({needle})")
          if failures:
              raise SystemExit("Forbidden regression(s):\n" + "\n".join(failures))
          PY

      - name: Run Full Test Suite (Zero Silent Skips)
        run: uv run pytest tests/unit tests/security tests/contract -rs -q
        env:
          CI: "true"
          FACTORY_API_KEY: sk-factory-test-token-valid
          STORAGE_BACKEND: local
