[project]
name = "factory-contracts"
version = "0.1.0"
description = "Declarative Pydantic schemas for Factory v4 manifests, errors, and jobs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
factory-manifest = "factory_contracts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_contracts", "src/contracts"]
