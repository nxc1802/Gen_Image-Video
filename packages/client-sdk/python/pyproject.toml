[project]
name = "factory-client"
version = "0.1.0"
description = "Official Python client SDK for Factory v4 Control API"
requires-python = ">=3.11"
dependencies = [
    "factory-contracts",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_client"]
