[project]
name = "factory-model-registry"
version = "0.1.0"
description = "Manifest loader and capability validator for Factory v4"
requires-python = ">=3.11"
dependencies = [
    "factory-contracts",
    "pyyaml>=6.0.1",
]

[project.scripts]
factory-manifest = "model_registry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_registry"]
