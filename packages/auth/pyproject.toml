[project]
name = "factory-auth"
version = "0.1.0"
description = "Authentication and single API key management for Factory v4 Lite"
requires-python = ">=3.11"
dependencies = [
    "factory-contracts",
    "fastapi>=0.111.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_auth"]
