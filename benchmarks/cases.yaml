version: "2.0"
description: "Unified declarative benchmark catalog covering 100% of declared tasks and variants across all 11 model manifests in Factory v4 Lite (Plan §4.4, §6.2, §6.6)"
total_cases: 91

cases:
  # =========================================================================
  # 1. Qwen Text (5 declared task-variant pairs)
  # =========================================================================
  - id: "BM-TXT-01"
    name: "Qwen Text Chat Completion Standard"
    model: "qwen-text"
    task: "chat_completion"
    variant: "standard"
    target_gpu: 0
    min_vram_gb: 12.0
    modes: ["smoke", "full", "perf"]
    inputs:
      messages:
        - role: "user"
          content: "Explain the architectural difference between unified memory and discrete GPU memory."
      max_tokens: 128
      temperature: 0.7
    expected_output:
      mime: "application/json"
      format: "json"
      min_bytes: 10
      rules:
        is_chat: true

  - id: "BM-TXT-02"
    name: "Qwen Text Responses API Standard"
    model: "qwen-text"
    task: "responses_api"
    variant: "standard"
    target_gpu: 0
    min_vram_gb: 12.0
    modes: ["smoke", "full", "perf"]
    inputs:
      prompt: "Respond concisely: What is the primary function of an inference control plane?"
      max_tokens: 64
    expected_output:
      mime: "application/json"
      format: "json"
      min_bytes: 10

  - id: "BM-TXT-03"
    name: "Qwen Text Structured Output Standard"
    model: "qwen-text"
    task: "structured_output"
    variant: "standard"
    target_gpu: 0
    min_vram_gb: 12.0
    modes: ["smoke", "full", "perf"]
    inputs:
      prompt: "Extract the status and code from: Server returned 200 OK."
      schema:
        type: "object"
        properties:
          status: {"type": "string"}
          code: {"type": "integer"}
        required: ["status", "code"]
    expected_output:
      mime: "application/json"
      format: "json"
      min_bytes: 15

  - id: "BM-TXT-04"
    name: "Qwen Text Tool Calling Standard"
    model: "qwen-text"
    task: "tool_calling"
    variant: "standard"
    target_gpu: 0
    min_vram_gb: 12.0
    modes: ["smoke", "full", "perf"]
    inputs:
      messages:
        - role: "user"
          content: "What is the temperature in Tokyo right now?"
      tools:
        - type: "function"
          function:
            name: "get_weather"
            parameters:
              type: "object"
              properties:
                location: {"type": "string"}
              required: ["location"]
    expected_output:
      mime: "application/json"
      format: "json"
      min_bytes: 15

  - id: "BM-TXT-05"
    name: "Qwen Text Streaming Standard"
    model: "qwen-text"
    task: "streaming"
    variant: "standard"
    target_gpu: 0
    min_vram_gb: 12.0
