version: "1.0"
description: "Master 163-case evaluation matrix for Factory v4 Lite (Plan §9.2 and §9.3)"
total_cases: 163

cases:
  # =========================================================================
  # GROUP 1: Router & Infrastructure (R01 to R28) - 28 cases
  # =========================================================================
  - id: "R01"
    group: "router_infrastructure"
    name: "Public Health Check Endpoint"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "health_check"
    description: "Verify GET /health returns HTTP 200 and healthy status without authentication"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 200 with status=healthy"

  - id: "R02"
    group: "router_infrastructure"
    name: "Model Discovery Catalog"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "model_discovery"
    description: "Verify GET /v1/models returns active model catalog with capabilities and limits"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 200 returning list of model manifests adhering to ModelManifest schema"

  - id: "R03"
    group: "router_infrastructure"
    name: "API Key Authentication Enforcement"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "auth_enforcement"
    description: "Verify protected endpoints reject requests missing Authorization Bearer header"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 401 Unauthorized when Authorization header is omitted"

  - id: "R04"
    group: "router_infrastructure"
    name: "Constant-Time Key Digest Comparison"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "auth_validation"
    description: "Verify malformed or invalid Bearer tokens are rejected via constant-time comparison"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 401 Unauthorized without timing side-channel leaks"

  - id: "R05"
    group: "router_infrastructure"
    name: "Valid Job Submission Acceptance"
    suite: "integration"
    model: "qwen-text"
    variant: "default"
    task: "text_chat"
    description: "Verify POST /v1/jobs accepts valid JobSubmissionRequest and returns job_id and QUEUED state"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 200/202 with valid UUID job_id and status=queued"

  - id: "R06"
    group: "router_infrastructure"
    name: "Malformed Payload Rejection"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "schema_validation"
    description: "Verify POST /v1/jobs rejects malformed payloads missing mandatory fields"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 422 or HTTP 400 with actionable error payload"

  - id: "R07"
    group: "router_infrastructure"
    name: "Unknown Model Family Rejection"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "model_validation"
    description: "Verify POST /v1/jobs rejects non-existent model names early before queuing"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 400 Bad Request with UNKNOWN_MODEL or INVALID_INPUT code"

  - id: "R08"
    group: "router_infrastructure"
    name: "Unsupported Capability Rejection"
    suite: "contract"
    model: "qwen-text"
    variant: "default"
    task: "text_to_video"
    description: "Verify requesting a capability unsupported by target model manifest is rejected"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 400 Bad Request with UNSUPPORTED_CAPABILITY error"

  - id: "R09"
    group: "router_infrastructure"
    name: "Oversized Inline Payload Rejection"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "payload_threshold"
    description: "Verify inline payloads exceeding 1MB threshold are rejected"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 413 Payload Too Large"

  - id: "R10"
    group: "router_infrastructure"
    name: "Job Status Query Lookup"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "status_lookup"
    description: "Verify GET /v1/jobs/{id} retrieves exact current job state and progress"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 200 with matching job_id, state, timestamps, and parameters"

  - id: "R11"
    group: "router_infrastructure"
    name: "Nonexistent Job Query Rejection"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "missing_job_lookup"
    description: "Verify GET /v1/jobs/{nonexistent_id} returns HTTP 404 cleanly"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 404 Not Found"

  - id: "R12"
    group: "router_infrastructure"
    name: "Job Progress SSE Event Stream"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "event_streaming"
    description: "Verify GET /v1/jobs/{id}/events streams SSE progress events until terminal state"
    hardware_requirement: "any"
    acceptance_criteria: "Content-Type text/event-stream delivering incremental progress packets"

  - id: "R13"
    group: "router_infrastructure"
    name: "Job Cancellation Execution"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "job_cancellation"
    description: "Verify DELETE /v1/jobs/{id} cleanly transitions active job to CANCELLED"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 200 with job state transitioning to CANCELLED"

  - id: "R14"
    group: "router_infrastructure"
    name: "Idempotent Double Cancellation"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "cancellation_idempotency"
    description: "Verify deleting an already cancelled job is handled idempotently without crash"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 200 or clean HTTP 400 indicating job is already terminal"

  - id: "R15"
    group: "router_infrastructure"
    name: "Terminal Job Cancellation Guard"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "terminal_cancel_guard"
    description: "Verify attempting to cancel a SUCCEEDED job returns HTTP 400"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 400 Bad Request with error stating job is completed"

  - id: "R16"
    group: "router_infrastructure"
    name: "Nonexistent Job Cancellation Rejection"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "missing_job_cancel"
    description: "Verify DELETE /v1/jobs/{nonexistent_id} returns HTTP 404"
    hardware_requirement: "any"
    acceptance_criteria: "HTTP 404 Not Found"

  - id: "R17"
    group: "router_infrastructure"
    name: "Job Submission Idempotency Map"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "idempotency_check"
    description: "Verify resubmitting identical request with same idempotency key returns existing job"
    hardware_requirement: "any"
    acceptance_criteria: "Existing job instance returned without duplicate queue insertion"

  - id: "R18"
    group: "router_infrastructure"
    name: "Worker Lease Acquisition"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "worker_leasing"
    description: "Verify POST /v1/jobs/lease assigns pending job to worker and transitions to RUNNING"
    hardware_requirement: "any"
    acceptance_criteria: "WorkerLease acquired with valid lease_id, ttl_seconds, and assigned job"

  - id: "R19"
    group: "router_infrastructure"
    name: "Worker Lease Renewal Heartbeat"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "lease_heartbeat"
    description: "Verify POST /v1/jobs/{id}/heartbeat extends lease deadline preventing watchdog reaper"
    hardware_requirement: "any"
    acceptance_criteria: "Lease expiration extended; job remains active in RUNNING state"

  - id: "R20"
    group: "router_infrastructure"
    name: "Tokenless Worker HTTP Completion"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "worker_completion"
    description: "Verify POST /v1/jobs/{id}/complete accepts worker completion without cryptographic lease tokens"
    hardware_requirement: "any"
    acceptance_criteria: "Job transitions to SUCCEEDED and lease released cleanly"

  - id: "R21"
    group: "router_infrastructure"
    name: "Missing Output Artifact Rejection (FIX-01)"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "artifact_validation"
    description: "Verify job fails if completion claims success but required output artifact is missing"
    hardware_requirement: "any"
    acceptance_criteria: "Job marked FAILED with ARTIFACT_MISSING error, not SUCCEEDED"

  - id: "R22"
    group: "router_infrastructure"
    name: "Real SHA-256 Checksum Verification (FIX-02)"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "checksum_verification"
    description: "Verify all-zero mock SHA-256 is rejected and genuine hash of artifact bytes is computed"
    hardware_requirement: "any"
    acceptance_criteria: "Calculated SHA-256 matches actual artifact bytes; all-zero hashes rejected"

  - id: "R23"
    group: "router_infrastructure"
    name: "GPU-Aware Retry Enqueue (FIX-03)"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "retry_partitioning"
    description: "Verify retried jobs re-enqueue to the same GPU partition as initial submission"
    hardware_requirement: "any"
    acceptance_criteria: "Retried job retains initial GPU affinity mapping"

  - id: "R24"
    group: "router_infrastructure"
    name: "Consolidated Subsystem GPU Map (FIX-04)"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "gpu_map_consistency"
    description: "Verify scheduler, leasing, manager, and watchdog share identical SUBSYSTEM_GPU_MAP"
    hardware_requirement: "any"
    acceptance_criteria: "Zero divergence across all internal queue component GPU maps"

  - id: "R25"
    group: "router_infrastructure"
    name: "Watchdog Deadline & Reaper Enforcement (FIX-05)"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "watchdog_reaper"
    description: "Verify watchdog terminates expired/dead worker leases without premature timeouts on slow jobs"
    hardware_requirement: "any"
    acceptance_criteria: "Dead workers reaped; valid slow jobs with active heartbeats preserved"

  - id: "R26"
    group: "router_infrastructure"
    name: "Misleading Model Alias Elimination (FIX-06)"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "alias_validation"
    description: "Verify misleading aliases (such as 72B mapping to 7B weights) are eliminated"
    hardware_requirement: "any"
    acceptance_criteria: "Requested model strictly resolves to true declared weight class"

  - id: "R27"
    group: "router_infrastructure"
    name: "Error Sanitization & Security Leak Guard"
    suite: "contract"
    model: "system"
    variant: "default"
    task: "error_sanitization"
    description: "Verify error responses sanitize internal stack traces, system paths, and API keys"
    hardware_requirement: "any"
    acceptance_criteria: "Zero stack traces or sensitive environment variables leaked in error messages"

  - id: "R28"
    group: "router_infrastructure"
    name: "Scratch Disk Delivery & Lifecycle Cleanup"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "scratch_cleanup"
    description: "Verify local scratch disk artifact delivery and automatic cleanup on expiration"
    hardware_requirement: "any"
    acceptance_criteria: "Artifact accessible during lease; expired scratch files removed"

  # =========================================================================
  # GROUP 2: GPU Runtime & Lifecycle (GPU-01 to GPU-10) - 10 cases
  # =========================================================================
  - id: "GPU-01"
    group: "gpu_runtime"
    name: "Model Load, Inference & Clean Unload"
    suite: "integration"
    model: "qwen-image-2.1"
    variant: "default"
    task: "gpu_lifecycle"
    description: "Verify loading model A, executing inference, and unloading returns VRAM near baseline"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "VRAM returns near baseline idle; process exited cleanly"

  - id: "GPU-02"
    group: "gpu_runtime"
    name: "Sequential Model Switch A -> B"
    suite: "integration"
    model: "wan-2.2"
    variant: "default"
    task: "model_switching"
    description: "Verify switching from Model A to Model B ensures Model B weights and outputs belong to B"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Active runtime reflects Model B; no stale Model A artifacts or VRAM residue"

  - id: "GPU-03"
    group: "gpu_runtime"
    name: "Independent Dual-GPU Concurrent Jobs"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "dual_gpu_concurrency"
    description: "Verify two concurrent jobs on distinct GPUs (GPU 0 and GPU 1) execute without conflict"
    hardware_requirement: "gpu_dual"
    acceptance_criteria: "Both jobs complete independently without VRAM or lock contention"

  - id: "GPU-04"
    group: "gpu_runtime"
    name: "Same-GPU Heavy Job Mutual Exclusion"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "same_gpu_exclusion"
    description: "Verify two heavy jobs targeting the same GPU serialize; second waits or conflicts"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Exclusive admission prevents simultaneous heavy resident models on single card"

  - id: "GPU-05"
    group: "gpu_runtime"
    name: "Dual-GPU Atomic Reservation"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "atomic_dual_reservation"
    description: "Verify models requiring both GPUs acquire and release both devices atomically"
    hardware_requirement: "gpu_dual"
    acceptance_criteria: "Zero half-leasing; atomic rollback if only one GPU is available"

  - id: "GPU-06"
    group: "gpu_runtime"
    name: "Backend Crash Lease Recovery"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "crash_recovery"
    description: "Verify worker/backend crash is recovered cleanly with BACKEND_CRASHED error code"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Lease reclaimed, GPU freed, job terminated with actionable error code"

  - id: "GPU-07"
    group: "gpu_runtime"
    name: "Cancellation During Load & Inference"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "cancel_during_load"
    description: "Verify cancellation signal during weight load stops process without orphan GPU leases"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "No stale busy GPU lock or ghost job remaining in queue"

  - id: "GPU-08"
    group: "gpu_runtime"
    name: "Heartbeat, Timeout & Retry Cycle"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "heartbeat_timeout_cycle"
    description: "Verify heartbeat renewal prevents false timeouts, while dead jobs trigger controlled retry"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "No false timeouts; retry count respected without infinite loops"

  - id: "GPU-09"
    group: "gpu_runtime"
    name: "Multi-Model Pipeline Sequence on GPU 1"
    suite: "integration"
    model: "system"
    variant: "default"
    task: "multi_model_pipeline"
    description: "Verify sequence ACE-Step -> YuE2 -> Video -> ACE-Step on GPU 1 without OOM"
    hardware_requirement: "dual_t4"
    acceptance_criteria: "Sequential evictions and admissions execute without cumulative VRAM accumulation"

  - id: "GPU-10"
    group: "gpu_runtime"
    name: "Repeated Swaps Memory Stability"
    suite: "benchmark"
    model: "system"
    variant: "default"
    task: "vram_leak_benchmark"
    description: "Verify 10 to 20 repeated model swaps produce zero cumulative VRAM leak (<50MB)"
    hardware_requirement: "dual_t4"
    acceptance_criteria: "Cumulative memory leak under 50MB across 15+ sequential model swaps"

  # =========================================================================
  # GROUP 3: Text Subsystem (T01 to T05) - 5 cases
  # =========================================================================
  - id: "T01"
    group: "text"
    name: "Qwen2.5-7B Text Chat Completion"
    suite: "live_model"
    model: "qwen-text"
    variant: "default"
    task: "text_chat"
    description: "Execute text chat prompt against Qwen2.5-7B-Instruct-AWQ backend"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Non-empty coherent text response adhering to chat conversation role"

  - id: "T02"
    group: "text"
    name: "Structured JSON Output Generation"
    suite: "live_model"
    model: "qwen-text"
    variant: "default"
    task: "text_json"
    description: "Verify generation of valid JSON conforming to specified JSON Schema"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Output string parses cleanly as valid JSON matching input schema"

  - id: "T03"
    group: "text"
    name: "Tool Calling & Function Arguments"
    suite: "live_model"
    model: "qwen-text"
    variant: "default"
    task: "text_tool_call"
    description: "Verify model generates syntactically valid function call and arguments"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Model outputs valid tool call block with parsed arguments"

  - id: "T04"
    group: "text"
    name: "Streaming Text SSE Generation"
    suite: "live_model"
    model: "qwen-text"
    variant: "default"
    task: "text_stream"
    description: "Verify streaming text generation delivers intact token chunks via SSE"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Sequential stream packets assemble into complete final text"

  - id: "T05"
    group: "text"
    name: "Context Window Limits & Custom Stop Tokens"
    suite: "live_model"
    model: "qwen-text"
    variant: "default"
    task: "text_context"
    description: "Verify context truncation policy and generation termination on custom stop tokens"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Output halts immediately upon reaching specified stop token sequence"

  # =========================================================================
  # GROUP 4: VLM Subsystem (V01 to V05) - 5 cases
  # =========================================================================
  - id: "V01"
    group: "vlm"
    name: "Single-Image Visual Question Answering"
    suite: "live_model"
    model: "qwen-vlm"
    variant: "default"
    task: "vlm_image_qa"
    description: "Verify Qwen2-VL-7B-Instruct-AWQ answers queries conditioned on an input image"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Output accurately describes visual features present in the image"

  - id: "V02"
    group: "vlm"
    name: "Multi-Image Visual Comparison"
    suite: "live_model"
    model: "qwen-vlm"
    variant: "default"
    task: "vlm_multi_image"
    description: "Verify comparison across two distinct visual inputs"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Response accurately details differences and shared elements between images"

  - id: "V03"
    group: "vlm"
    name: "Video Frame Temporal Comprehension"
    suite: "live_model"
    model: "qwen-vlm"
    variant: "default"
    task: "vlm_video_frames"
    description: "Verify visual comprehension across sequential extracted video frames"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Response describes action progression across the frame sequence"

  - id: "V04"
    group: "vlm"
    name: "Document QA & Tabular OCR"
    suite: "live_model"
    model: "qwen-vlm"
    variant: "default"
    task: "vlm_document_qa"
    description: "Verify extracting structured text and data points from document/chart images"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Extracted data fields match values visible in the input image"

  - id: "V05"
    group: "vlm"
    name: "Visual Grounding & Bounding Boxes"
    suite: "live_model"
    model: "qwen-vlm"
    variant: "default"
    task: "vlm_grounding"
    description: "Verify object localization producing normalized bounding box coordinates [ymin, xmin, ymax, xmax]"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Returned coordinates accurately envelope the specified target object"

  # =========================================================================
  # GROUP 5: Decision Subsystem (D01 to D03) - 3 cases
  # =========================================================================
  - id: "D01"
    group: "decision"
    name: "Boolean Predicate Evaluation"
    suite: "live_model"
    model: "qwen-decision"
    variant: "default"
    task: "predicate_evaluation"
    description: "Verify Qwen2.5-3B-Instruct evaluates complex conditions into binary true/false"
    hardware_requirement: "any"
    acceptance_criteria: "Deterministic boolean output with confidence score >= 0.5"

  - id: "D02"
    group: "decision"
    name: "Multi-Way Route Choice Selection"
    suite: "live_model"
    model: "qwen-decision"
    variant: "default"
    task: "route_selection"
    description: "Verify selecting the optimal execution route from candidate branches"
    hardware_requirement: "any"
    acceptance_criteria: "Valid route selected from provided choices with normalized probability distribution"

  - id: "D03"
    group: "decision"
    name: "Score & Ranking Evaluation"
    suite: "live_model"
    model: "qwen-decision"
    variant: "default"
    task: "ranking_evaluation"
    description: "Verify scoring and ranking multiple candidates based on rubric"
    hardware_requirement: "any"
    acceptance_criteria: "Strictly ordered ranking list with monotone score distribution"

  # =========================================================================
  # GROUP 6: Embedding & Rerank Subsystem (E01 to E04) - 4 cases
  # =========================================================================
  - id: "E01"
    group: "embedding"
    name: "Single Text Embedding Vector"
    suite: "live_model"
    model: "qwen-embedding"
    variant: "default"
    task: "text_embedding"
    description: "Verify Qwen3-Embedding-0.6B generates 1024-dim L2-normalized float vector"
    hardware_requirement: "any"
    acceptance_criteria: "Output vector length is 1024 with L2 norm equal to 1.0 within 1e-4 tolerance"

  - id: "E02"
    group: "embedding"
    name: "Batch Text Embedding"
    suite: "live_model"
    model: "qwen-embedding"
    variant: "default"
    task: "batch_embedding"
    description: "Verify batch embedding of multiple sentences preserving independent vectors"
    hardware_requirement: "any"
    acceptance_criteria: "Matrix shape [N, 1024] with every row unit-normalized"

  - id: "E03"
    group: "embedding"
    name: "Semantic Retrieval Similarity"
    suite: "live_model"
    model: "qwen-embedding"
    variant: "default"
    task: "semantic_retrieval"
    description: "Verify cosine similarity ranks semantically related text above unrelated text"
    hardware_requirement: "any"
    acceptance_criteria: "Similarity(positive_pair) > Similarity(negative_pair) + 0.3"

  - id: "E04"
    group: "embedding"
    name: "Document Reranking"
    suite: "live_model"
    model: "qwen-embedding"
    variant: "default"
    task: "document_reranking"
    description: "Verify cross-encoder reranker scores and re-orders document relevance"
    hardware_requirement: "any"
    acceptance_criteria: "Most relevant document placed at rank 1 with highest score"

  # =========================================================================
  # GROUP 7: Speech Subsystem (S01 to S11) - 11 cases
  # =========================================================================
  - id: "S01"
    group: "speech"
    name: "Automatic Speech Recognition (ASR)"
    suite: "live_model"
    model: "qwen-speech"
    variant: "default"
    task: "speech_asr"
    description: "Verify uploaded audio waveform transcribes accurately into text"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Generated transcript matches spoken audio content with low WER"

  - id: "S02"
    group: "speech"
    name: "Text-to-Speech Synthesis (TTS)"
    suite: "live_model"
    model: "qwen-speech"
    variant: "default"
    task: "speech_tts"
    description: "Verify text synthesis produces audible, non-empty WAV audio"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Valid WAV audio artifact with sample rate >= 22050 Hz and non-zero duration"

  - id: "S03"
    group: "speech"
    name: "Zero-Shot Voice Cloning"
    suite: "live_model"
    model: "qwen-speech"
    variant: "default"
    task: "voice_cloning"
    description: "Verify reference audio conditioning guides synthesis toward reference timbre"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Synthesized audio reflects timbre and acoustic profile of reference asset"

  - id: "S04"
    group: "speech"
    name: "Streaming ASR Chunk Assembly"
    suite: "live_model"
    model: "qwen-speech"
    variant: "default"
    task: "streaming_asr"
    description: "Verify real-time audio chunk stream assembles into stable final transcript"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Progressive chunks assemble without duplicated or dropped words"

  - id: "S05"
    group: "speech"
    name: "Word-Level Timestamp Alignment"
    suite: "live_model"
    model: "qwen-speech"
    variant: "default"
    task: "word_alignment"
    description: "Verify forced alignment generates per-word start and end timestamps"
    hardware_requirement: "gpu_single"
    acceptance_criteria: "Monotonically increasing word timestamps within audio duration bounds"

  - id: "S06"
    group: "speech"
    name: "Speech Speed & Tempo Control"
