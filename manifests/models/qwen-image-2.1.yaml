runtime_profiles:
  kaggle-dual-t4:
    gpu_count: 1
    min_vram_gb: 14.0
    preferred_backend: comfyui
    exclusive: false
    cpu_offload: true
    notes: Declared preflight requirements; not hardware certification. CLI assigns
      devices explicitly. Runtime load and semantic validation remain required.
validation:
  state: EXPERIMENTAL
  reasons:
  - Diffusion compute explicitly uses native FP32 on T4; pinned Comfy QwenImage21
    supports BF16/FP32, not FP16. Original Q4_K_M, FP8 text encoder and BF16 VAE
    checkpoint files are unchanged. No automatic dtype or checkpoint fallback.
  - Standard target is explicitly pinned to Unsloth Standard weights. Existing Kaggle
    GGUF SHA 833439e9... belongs to an Uncensored lineage and must fail checkpoint
    verification for this ID. No existing image inference evidence certifies Standard.
  - Pose/depth ControlNet weights are not part of this pinned bundle; those capabilities
    are not declared as supported. No implicit auxiliary-checkpoint selection.
  implemented_capabilities:
  - image.text_to_image
  - image.image_to_image
  - image.inpaint
  - image.outpaint
  - image.instruction_edit
  - image.reference_image
  - image.multi_reference
