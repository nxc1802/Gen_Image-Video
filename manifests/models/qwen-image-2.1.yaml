apiVersion: factory.ai/v1
kind: ModelManifest
metadata:
  id: qwen-image-2.1
  family: qwen-image
  display_name: "Qwen-Image 2.1 Family"
  service_id: image-service
  version: "2.1.0"

weights:
  primary_checkpoint: "abenzerps/Qwen-Image-2.1-GGUF/qwen-image-2.1-Q4_K_M.gguf"
  components:
    clip: "qwen3vl_8b_fp8_scaled.safetensors"
    vae: "qwen_image_2.1_vae_bf16.safetensors"
  format: gguf
  quantization: q4_k_m
  default_precision: bf16

hardware:
  min_vram_gb: 14.0
  preferred_gpu: t4
  allocation_policy: single_gpu

capabilities:
  text_to_image: true
  image_to_image: false
  inpaint: false
  outpaint: false
  instruction_edit: false
  reference_image: false
  multi_reference: false
  control_pose: false
  control_depth: false

status: partial
coverage_percent: 11.11
missing_capabilities:
  - image_to_image
  - inpaint
  - outpaint
  - instruction_edit
  - reference_image
  - multi_reference
  - control_pose
  - control_depth

limits:
  max_width: 2048
  max_height: 2048
