  image_to_image: true
  inpaint: true
  outpaint: true
  instruction_edit: true
  reference_image: true
  multi_reference: true
  control_pose: true
  control_depth: true

status: full
coverage_percent: 100.0
missing_capabilities: []
validation_status: pending_live
validation_notes: "All required Factory workflows are present; real GPU/workflow execution remains a release gate."

limits:
  max_width: 2048
  max_height: 2048
