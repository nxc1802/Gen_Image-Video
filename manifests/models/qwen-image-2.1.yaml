apiVersion: factory.ai/v1
kind: ModelManifest
metadata:
  id: qwen-image-2.1
  family: qwen-image
  display_name: "Qwen-Image 2.1 Family"
  service_id: image-service
  version: "2.1.0"

weights:
  primary_checkpoint: "abenzerps/Qwen-Image-2.1-GGUF/qwen-image-2.1-Q4_K_M.gguf"
  components:
    clip: "qwen3vl_8b_fp8_scaled.safetensors"
    vae: "qwen_image_2.1_vae_bf16.safetensors"
    control_pose: "qwen_image_control_pose.safetensors"
    control_depth: "qwen_image_control_depth.safetensors"
  format: gguf
  quantization: q4_k_m
  default_precision: bf16

