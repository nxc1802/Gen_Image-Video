apiVersion: factory.ai/v1
kind: ModelManifest
metadata:
  id: qwen-embedding
  family: qwen-embedding
  display_name: "Qwen Embedding & Reranker"
  service_id: embed-service
  version: "1.0.0"

weights:
  primary_checkpoint: "Qwen/Qwen3-Embedding-0.6B"
  components:
    reranker: "Qwen/Qwen3-Reranker-0.6B"
  format: safetensors
  quantization: none
  default_precision: fp16

hardware:
  min_vram_gb: 4.0
  context_window: 8192
  preferred_gpu: t4
  allocation_policy: single_gpu

capabilities:
  text_embedding: true
  multimodal_embedding: false
  reranking: true

status: partial
coverage_percent: 66.67
missing_capabilities:
  - multimodal_embedding

limits:
  max_context_tokens: 8192
