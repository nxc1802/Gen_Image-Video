apiVersion: factory.ai/v1
kind: ModelManifest
metadata:
  id: qwen-speech
  family: qwen-speech
  display_name: "Qwen3 ASR & TTS Suite"
  service_id: speech-service
  version: "3.0.0"

weights:
  primary_checkpoint: "Qwen/Qwen3-ASR-1.7B"
  components:
    tts_base: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
  format: safetensors
  quantization: none
  default_precision: bf16

hardware:
  min_vram_gb: 8.0
  preferred_gpu: t4
  allocation_policy: dual_gpu_split

capabilities:
  speech_to_text: true
  text_to_speech: true
  voice_cloning: true
  word_timestamps: false

status: partial
coverage_percent: 75.0
missing_capabilities:
  - word_timestamps

limits:
  max_duration_seconds: 300.0

validation_status: pending_live
validation_notes: "ASR and TTS pipelines configured for dual_gpu_split. Word alignment remains gated."

revision: "3.0.0"
dependencies:
  - "torch>=2.4.0"
  - "torchaudio"
  - "transformers"

task_variant_matrix:
  speech_to_text:
    - standard
  text_to_speech:
    - standard
  voice_cloning:
    - standard

validated_hardware_profiles:
  - "kaggle-dual-t4"
  - "colab-single-t4"

installed: true
checkpoint_valid: true
backend_ready: true
evidence_run_id: null

capabilities_truth:
  speech_to_text:
    declared: true
    implemented: true
    live_verified: false
    evidence_run_id: null
  text_to_speech:
    declared: true
    implemented: true
    live_verified: false
    evidence_run_id: null
  voice_cloning:
    declared: true
    implemented: true
    live_verified: false
    evidence_run_id: null
  word_timestamps:
    declared: true
    implemented: false
    live_verified: false
    evidence_run_id: null
