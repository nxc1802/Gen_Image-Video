  adapter: wan
  supported:
  - diffusers
capabilities:
  video.text_to_video: true
  video.image_to_video: true
  video.first_last_frame_to_video: true
  video.video_extension: true
  video.video_with_audio: false
  video.reference_conditioning: false
parameters:
  max_width:
    type: integer
    default: 1280
  max_height:
    type: integer
    default: 720
  max_frames:
    type: integer
    default: 81
  max_duration_seconds:
    type: number
    default: 5.0
  width:
    type: integer
    default: 512
  height:
    type: integer
    default: 512
  num_frames:
    type: integer
    default: 17
  steps:
    type: integer
    default: 30
    minimum: 1
    maximum: 100
  fps:
    type: integer
    default: 16
runtime_profiles:
  kaggle-dual-t4:
    gpu_count: 1
    min_vram_gb: 14
    preferred_backend: diffusers
    exclusive: false
    cpu_offload: true
    offload_strategy: sequential
    inference_timeout_seconds: 1800
    notes: Declared preflight requirements; not hardware certification. CLI assigns
      devices explicitly. Runtime load and semantic validation remain required.
    component_tiling:
      vae:
        tile_height: 512
        tile_width: 512
        stride_height: 384
        stride_width: 384
validation:
  state: EXPERIMENTAL
  reasons:
  - Exact TI2V-5B Diffusers snapshot pinned. Old A14B ComfyUI templates are not implementations
    of this checkpoint. CPU offload/T4 feasibility and all adapters require validation;
    do not substitute A14B/GGUF.
  implemented_capabilities:
  - video.text_to_video
  - video.image_to_video
  - video.first_last_frame_to_video
  - video.video_extension
