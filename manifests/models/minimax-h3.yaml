apiVersion: factory.ai/v1
kind: ModelManifest
metadata:
  id: minimax-h3
  family: minimax-video
  display_name: "MiniMax Hailuo H3 Family"
  service_id: video-service
  version: "3.0.0"

weights:
  primary_checkpoint: "MiniMax/Hailuo-H3-Diffusers"
  components:
    vae: "minimax_h3_audio_vae.safetensors"
  format: diffusers
  quantization: "4bit"
  default_precision: fp16

hardware:
  min_vram_gb: 14.0
  preferred_gpu: t4
  allocation_policy: single_gpu

capabilities:
  text_to_video: false
  image_to_video: false
  first_last_frame_to_video: false
  video_with_audio: false

status: partial
coverage_percent: 0.0
missing_capabilities:
  - text_to_video
  - image_to_video
  - first_last_frame_to_video
  - video_with_audio

limits:
  max_width: 1280
  max_height: 720
  max_frames: 121
  max_duration_seconds: 6.0
