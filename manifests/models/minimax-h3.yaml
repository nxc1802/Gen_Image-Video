apiVersion: factory.ai/v1
kind: ModelManifest
metadata:
  id: minimax-h3
  family: minimax-video
  display_name: "MiniMax Hailuo H3 Family"
  service_id: video-service
  version: "3.0.0"

weights:
  primary_checkpoint: "MiniMax/Hailuo-H3-Diffusers"
  components:
    audio_vae: "minimax_h3_audio_vae_fp32.safetensors"
    video_vae: "minimax_h3_video_vae_fp16.safetensors"
  format: diffusers
  quantization: "4bit"
  default_precision: fp16

hardware:
  min_vram_gb: 14.0
  preferred_gpu: t4
  allocation_policy: single_gpu

capabilities:
  text_to_video: true
  image_to_video: true
  first_last_frame_to_video: true
  video_with_audio: true
  reference_conditioning: true
  video_extension: false

status: partial
coverage_percent: 83.33
missing_capabilities:
  - video_extension
validation_status: pending_live
validation_notes: "T2VA/I2VA/FL2VA/Ref2VA workflows are present; extension is not implemented for this model family."

limits:
  max_width: 1280
  max_height: 720
  max_frames: 121
  max_duration_seconds: 6.0
