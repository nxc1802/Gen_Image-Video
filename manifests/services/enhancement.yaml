apiVersion: factory.ai/v1
kind: ServiceManifest
metadata:
  id: enhancement-service
  name: "Post-Processing & Media Enhancement Daemon"
  subsystem: enhancement
  version: 1.0.0

network:
  static_domain: "${NGROK_DOMAIN_ENHANCEMENT}"
  internal_port: 8002
  protocol: http
  auth_required: true
  cors_origins:
    - https://studio.ai.example.com
    - http://localhost:3000

health_check:
  endpoint: /health
  interval_seconds: 15
  timeout_seconds: 5
  unhealthy_threshold: 3

framework:
  type: custom
  version: "1.0.0"
  entrypoint: "python -m services.enhancement.server --port 8002"

hardware:
  gpu_required: true
  gpu_device_index: 1
  min_vram_gb: 6.0
  min_ram_gb: 8.0
  cuda_version_min: "12.1"

supported_modalities:
  - image
  - video
  - audio

auth_policy:
  scheme: bearer
  jwt_audience: factory-enhance-api
  rate_limit_rpm: 30
  allow_unauthenticated: false
