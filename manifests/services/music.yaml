apiVersion: factory.ai/v1
kind: ServiceManifest
metadata:
  id: music-service
  name: "ACE-Step 1.5 Music Generation Service"
  subsystem: music
  version: 1.0.0

network:
  static_domain: music.ai.example.com
  internal_port: 8001
  protocol: http
  auth_required: true
  cors_origins:
    - https://studio.ai.example.com
    - http://localhost:3000

health_check:
  endpoint: /health
  interval_seconds: 15
  timeout_seconds: 5
  unhealthy_threshold: 3

framework:
  type: acestep
  version: "1.5.0"
  entrypoint: "python -m services.music.server --port 8001"

hardware:
  gpu_required: true
  gpu_device_index: 1
  min_vram_gb: 6.0
  min_ram_gb: 8.0
  cuda_version_min: "12.1"

supported_modalities:
  - audio

auth_policy:
  scheme: bearer
  jwt_audience: factory-music-api
  rate_limit_rpm: 30
  allow_unauthenticated: false
