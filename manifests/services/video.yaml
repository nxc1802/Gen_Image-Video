apiVersion: factory.ai/v1
kind: ServiceManifest
metadata:
  id: video-service
  name: "ComfyUI Video Generation Daemon (GPU 1)"
  subsystem: video
  version: 1.0.0

network:
  static_domain: "${NGROK_DOMAIN_VIDEO}"
  internal_port: 8189
  protocol: http
  auth_required: true
  cors_origins:
    - https://studio.ai.example.com
    - http://localhost:3000

health_check:
  endpoint: /system_stats
  interval_seconds: 15
  timeout_seconds: 5
  unhealthy_threshold: 3

framework:
  type: comfyui
  version: "0.3.0"
  entrypoint: "python -m services.video.launcher.run_comfyui"

hardware:
  gpu_required: true
  gpu_device_index: 1
  min_vram_gb: 14.0
  min_ram_gb: 16.0
  cuda_version_min: "12.1"

supported_modalities:
  - video

auth_policy:
  scheme: edge-basic
  jwt_audience: factory-video-api
  rate_limit_rpm: 15
  allow_unauthenticated: false
