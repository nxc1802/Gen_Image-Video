apiVersion: factory.ai/v1
kind: ServiceManifest
metadata:
  id: embed-service
  name: "vLLM / TEI Vector Embedding & Rerank Daemon"
  subsystem: embedding
  version: 1.0.0

network:
  static_domain: embed.ai.example.com
  internal_port: 8083
  protocol: http
  auth_required: true
  cors_origins:
    - https://studio.ai.example.com
    - http://localhost:3000

health_check:
  endpoint: /health
  interval_seconds: 15
  timeout_seconds: 5
  unhealthy_threshold: 3

framework:
  type: vllm
  version: "0.4.2"
  entrypoint: "python -m vllm.entrypoints.openai.api_server --port 8083"

hardware:
  gpu_required: true
  gpu_device_index: 0
  min_vram_gb: 4.0
  min_ram_gb: 8.0
  cuda_version_min: "12.1"

supported_modalities:
  - embedding

auth_policy:
  scheme: bearer
  jwt_audience: factory-embed-api
  rate_limit_rpm: 120
  allow_unauthenticated: false
