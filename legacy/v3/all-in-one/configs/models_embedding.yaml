# ==============================================================================
# 🧬 Kaggle Embedding & Rerank AI Studio Configuration (Dedicated Embedding Mode)
# ==============================================================================
# Hardware Allocation Strategy (Dual-GPU Tesla T4 32GB VRAM):
# - GPU 0 (cuda:0) - 3 Model Dòng Text:
#   * Qwen3-Embedding-0.6B & Qwen3-Reranker-0.6B (~0.76 GB)
#   * Qwen3-Embedding-4B & Qwen3-Reranker-4B (~4.76 GB)
#   * Qwen3-Embedding-8B & Qwen3-Reranker-8B (~9.04 GB)
#   Total estimated VRAM: ~9.5 GB to 14.5 GB / 16 GB (An toàn, Zero OOM)
# - GPU 1 (cuda:1) - 2 Model Dòng Vision-Language (VL):
#   * Qwen3-VL-Embedding-2B & Qwen3-VL-Reranker-2B (~2.96 GB)
#   * Qwen3-VL-Embedding-8B & Qwen3-VL-Reranker-8B (~10.69 GB)
#   Total estimated VRAM: ~10.7 GB / 16 GB (An toàn, Zero OOM)
# - Runtime: Official llama-server / llama_cpp với lượng tử hóa Q4_K_M 100%
# ==============================================================================

models:
  # ----------------------------------------------------------------------------
  # 1. TEXT EMBEDDING MODELS (GPU 0)
  # ----------------------------------------------------------------------------
  embedding_0_6b:
    id: "Qwen/Qwen3-Embedding-0.6B"
    hf_repo: "mradermacher/Qwen3-Embedding-0.6B-GGUF"
    model_file: "Qwen3-Embedding-0.6B.Q4_K_M.gguf"
    quantization: "q4_k_m"
    format: "gguf"
    device: "cuda:0"
    device_strategy: "single"
    dimensions: 1024
    max_tokens: 8192
    lifecycle: "always_active"
    preload: true
    init_target: "gpu"

