# ==============================================================================
# 👁️ Kaggle VLM AI Studio Configuration (Dedicated VLM Mode)
# - Chỉ nạp Dataset & Model Vision-Language (VLM)
# - Auto-load thẳng VLM vào GPU VRAM ngay khi khởi động
# ==============================================================================

models:
  vlm:
    id: "cuongnguyen1802/qwen38-27b-gguf"
    fallback_id: "Qwen/Qwen2.5-VL-3B-Instruct"
    format: "gguf"
    model_file: "Qwen3.8-27B-Q4_K_M.gguf"
    mmproj_file: "mmproj-Qwen3.8-27B-Q8_0.gguf"
    quantization: "q4_k_m"
    precision: "fp16"
    lifecycle: "always_active"
    preload: true
    init_target: "gpu"
    allocation_policy: "dual_gpu"
    device_strategy: "dual_gpu"
    gpu_count: 2
    gpu_split: [0.5, 0.5]
    n_ctx: 4096
    n_gpu_layers: -1
    max_tokens: 1024
    temperature: 0.7
    spec_mode: "mtp"
    draft_model_file: "mtp-Qwen3.8-27B-Q4_0.gguf"
    draft_n_max: 3
