# ==============================================================================
# 🎙️ Kaggle Speech AI Studio Configuration (Dedicated Speech Mode)
# - Chỉ nạp Dataset & Model Speech:
#   1. Qwen3-ASR 1.7B (Multilingual & Tiếng Việt STT)
#   2. Qwen3-TTS 1.7B (Multilingual, VoiceDesign, CustomVoice TTS)
#   3. XTTS-v2 Vietnamese (Tiếng Việt chuyên biệt & Voice Cloning)
# - Auto-load thẳng cả 3 model vào GPU VRAM (cuda:0) ngay khi khởi động
# - Không nạp VLM hay Image/Video để bảo toàn 100% VRAM và RAM
# ==============================================================================

models:
  stt:
    id: "Qwen/Qwen3-ASR-1.7B"
    fallback_id: "openai/whisper-large-v3-turbo"
    precision: "fp16"
    backend: "audio_service"
    lifecycle: "always_active"
    preload: true
    init_target: "gpu"
    device: "cuda:0"
    device_strategy: "single"

  tts:
    id: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
    xtts_id: "thivux/XTTS-v2-vietnamse"
    fallback_id: "hexgrad/Kokoro-82M"
    voice: "default"
    precision: "fp16"
    backend: "audio_service"
    lifecycle: "always_active"
    preload: true
    init_target: "gpu"
    device: "cuda:0"
    device_strategy: "single"
