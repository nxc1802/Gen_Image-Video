# ==============================================================================
# 🖼️🎬 Kaggle Image & Video AI Studio Configuration (Dedicated Visual Mode)
# - Chỉ nạp Dataset & Model Image/Video (Qwen-Image-2.1 & Wan2.2 Video)
# - Chạy qua ComfyUI Backend với toàn bộ VRAM dành riêng cho Visual Generation
# ==============================================================================

models:
  image:
    id: "abenzerps/Qwen-Image-2.1-GGUF"
    default_variant: "qwen_image_21"
    backend: "comfyui"
    device: "cuda:0"
    gpu_device: 0
    device_strategy: "single"
    model_file: "qwen-image-2.1-Q4_K_M.gguf"
    clip_file: "qwen3vl_8b_fp8_scaled.safetensors"
    vae_file: "qwen_image_2.1_vae_bf16.safetensors"
    variants:
      qwen_image_21: "abenzerps/Qwen-Image-2.1-GGUF"
      2.1: "abenzerps/Qwen-Image-2.1-GGUF"
      qwen: "abenzerps/Qwen-Image-2.1-GGUF"
    quantization: "q4_k_m"
    precision: "fp16"
    lifecycle: "dynamic_switch"
    preload: false
    init_target: "cpu"
    width: 1280
    height: 720
    steps: 20
    guidance: 1.0
    sampler_name: "euler"
    scheduler: "simple"

  video:
    id: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
    default_variant: "ti2v_5b"
    fallback_id: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
    backend: "comfyui"
    device: "cuda:1"
    gpu_device: 1
    device_strategy: "single"
    variants:
      ti2v_5b: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
      5b: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
      t2v_a14b: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
      a14b: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
      i2v_a14b: "Wan-AI/Wan2.2-I2V-A14B-Diffusers"
      minimax_h3: "Comfy-Org/MiniMax-H3"
    quantization: "4bit"
    precision: "fp16"
    lifecycle: "dynamic_switch"
    preload: false
    init_target: "cpu"
    num_frames: 17
    width: 832
    height: 480
    steps: 20
    guidance: 5.0
    shift: 8.0
    fps: 24

  minimax:
    id: "Comfy-Org/MiniMax-H3"
    default_variant: "minimax_h3"
    backend: "comfyui"
    device: "cuda:1"
    gpu_device: 1
    device_strategy: "single"
    model_file: "minimax_h3_fl2va_pruned_int8_convrot.safetensors"
    ref2va_model_file: "minimax_h3_ref2va_pruned_int8_convrot.safetensors"
    turbo_lora_file: "minimax_h3_turbo_4step_pruned_comfyui.safetensors"
    clip_file: "qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
    video_vae_file: "minimax_h3_video_vae_fp16.safetensors"
    audio_vae_file: "minimax_h3_audio_vae_fp32.safetensors"
    variants:
      minimax_h3: "Comfy-Org/MiniMax-H3"
      h3: "Comfy-Org/MiniMax-H3"
      fl2va: "Comfy-Org/MiniMax-H3"
      ref2va: "Comfy-Org/MiniMax-H3-Ref2VA"
      ref2v: "Comfy-Org/MiniMax-H3-Ref2VA"
      minimax_h3_turbo: "Comfy-Org/MiniMax-H3-Turbo"
      ref2va_turbo: "Comfy-Org/MiniMax-H3-Ref2VA-Turbo"
    quantization: "int8_convrot"
    precision: "fp16"
    lifecycle: "dynamic_switch"
    preload: false
    init_target: "cpu"
    num_frames: 33
    width: 768
    height: 448
    steps: 14
    turbo_steps: 6
    guidance: 1.0
    shift: 8.0
    fps: 24
    enable_audio: false
    use_turbo: false
    sampler_name: "euler"
    scheduler: "simple"

