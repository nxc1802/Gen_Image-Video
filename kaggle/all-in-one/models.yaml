# ==============================================================================
# 🎨 Kaggle All-in-One AI Studio: RAM-First Dynamic Memory Architecture
# - Toàn bộ model ban đầu chỉ nằm trong CPU RAM (Zero initial VRAM)
# - Chỉ khi có request mới nạp vào VRAM và dọn dẹp các model khác
# - Hỗ trợ 2 chế độ: 1-GPU (cho model nhỏ) và 2-GPU (cho model lớn)
# - Chuẩn hóa toàn bộ model sang FP16 / BF16
# ==============================================================================

models:
  # 🎙️ 1. Speech-to-Text (Whisper Turbo FP16)
  stt:
    id: "openai/whisper-large-v3-turbo"
    precision: "fp16"
    lifecycle: "dynamic_switch"    # Hoán đổi động, không chiếm VRAM vĩnh viễn
    preload: false                 # Khởi động không nạp VRAM
    init_target: "cpu"
    device_strategy: "auto"        # Tự động chọn GPU trống

  # 🔊 2. Text-to-Speech (Kokoro-82M FP16)
  tts:
    id: "hexgrad/Kokoro-82M"
    voice: "af_heart"
    precision: "fp16"
    lifecycle: "dynamic_switch"    # Hoán đổi động, không chiếm VRAM vĩnh viễn
    preload: false                 # Khởi động không nạp VRAM
    init_target: "cpu"
    device_strategy: "auto"

  # 👁️ 3. Vision-Language Model (VLM / Qwen3.8-27B GGUF)
  # - Định dạng: GGUF (Unsloth Dynamic V3.0 UD-Q4_K_M) kèm Vision mmproj-F16
  # - Phân bổ Dual-GPU: Tận dụng trọn vẹn 2x Tesla T4 (Layer-Splitting 50-50 qua PCIe)
  vlm:
    id: "nguynxuncngde180528/qwen38-27b-vlm-gguf"
    fallback_id: "Qwen/Qwen2.5-VL-3B-Instruct"
    format: "gguf"
    model_file: "Qwen3.8-27B-UD-Q4_K_M.gguf"
    mmproj_file: "mmproj-F16.gguf"
    quantization: "q4_k_m"
    precision: "fp16"
    lifecycle: "dynamic_switch"    # Hoán đổi động với 30GB CPU RAM khi chạy FLUX/Wan
    preload: false                 # Khởi động không nạp VRAM (Lazy load hoặc nạp theo request)
    init_target: "cpu"
    allocation_policy: "dual_gpu"  # Bắt buộc chia 2 GPU (Layer-split trên 2x Tesla T4 16GB)
    device_strategy: "dual_gpu"
    gpu_count: 2
    gpu_split: [0.5, 0.5]
    n_ctx: 4096
    n_gpu_layers: -1               # Offload 100% tầng lên 2 GPU
    max_tokens: 1024
    temperature: 0.7

  # 🖼️ 4. Text-to-Image & Inpainting (FLUX.2 Klein SOTA GGUF + Qwen3-4B Text Encoder)
  # - Kiến trúc Flow Matching Transformer 4B siêu tốc (4 steps distillation)
  # - Toàn bộ pipeline (< 5GB) nạp gọn gàng trên 1 GPU đơn (Zero CPU Offload, Zero OOM)
  image:
    id: "unsloth/FLUX.2-klein-4B-GGUF"
    default_variant: "klein_4b"
    model_file: "flux-2-klein-4b-Q4_K_M.gguf"
    text_encoder_repo: "unsloth/Qwen3-4B-GGUF"
    text_encoder_file: "Qwen3-4B-Q4_K_M.gguf"
    variants:
      klein_4b: "unsloth/FLUX.2-klein-4B-GGUF"
      4b: "unsloth/FLUX.2-klein-4B-GGUF"
      klein_9b: "unsloth/FLUX.2-klein-9B-GGUF"
      9b: "unsloth/FLUX.2-klein-9B-GGUF"
      dev: "black-forest-labs/FLUX.2-dev"
    quantization: "q4_k_m"
    precision: "fp16"
    lifecycle: "dynamic_switch"
    preload: false                 # Tắt preload image
    init_target: "cpu"
    allocation_policy: "single_gpu"
    device_strategy: "single_gpu"
    steps: 4
    guidance: 1.0

  # 🎬 5. Text-to-Video & Image-to-Video (Wan2.2 SOTA FP16)
  video:
    id: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
    default_variant: "ti2v_5b"
    fallback_id: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
    variants:
      ti2v_5b: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
      5b: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
      t2v_a14b: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
      a14b: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
      i2v_a14b: "Wan-AI/Wan2.2-I2V-A14B-Diffusers"
      ti2v_5b_22: "Wan-AI/Wan2.2-TI2V-5B-Diffusers"
      t2v_a14b_22: "Wan-AI/Wan2.2-T2V-A14B-Diffusers"
      i2v_a14b_22: "Wan-AI/Wan2.2-I2V-A14B-Diffusers"
      t2v_1_3b: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
      t2v_14b: "Wan-AI/Wan2.1-T2V-14B-Diffusers"
      i2v_14b: "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"
    quantization: "4bit"
    precision: "fp16"
    lifecycle: "dynamic_switch"
    preload: true                  # Preload Wan2.2-5B lên GPU sẵn sàng test
    init_target: "gpu"
    allocation_policy: "adaptive"
    device_strategy: "auto"
    num_frames: 17
    width: 832
    height: 480
    steps: 20
    guidance: 5.0



