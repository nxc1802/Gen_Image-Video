# ==============================================================================
# 🎨 Kaggle All-in-One AI Studio: RAM-First Dynamic Memory Architecture
# - Toàn bộ model ban đầu chỉ nằm trong CPU RAM (Zero initial VRAM)
# - Chỉ khi có request mới nạp vào VRAM và dọn dẹp các model khác
# - Hỗ trợ 2 chế độ: 1-GPU (cho model nhỏ) và 2-GPU (cho model lớn)
# - Chuẩn hóa toàn bộ model sang FP16 / BF16
# ==============================================================================

models:
  # 🎙️ 1. Speech-to-Text (Whisper Turbo FP16)
  stt:
    id: "openai/whisper-large-v3-turbo"
    precision: "fp16"
    lifecycle: "dynamic_switch"    # Hoán đổi động, không chiếm VRAM vĩnh viễn
    preload: false                 # Khởi động không nạp VRAM
    init_target: "cpu"
    device_strategy: "auto"        # Tự động chọn GPU trống

  # 🔊 2. Text-to-Speech (Kokoro-82M FP16)
  tts:
    id: "hexgrad/Kokoro-82M"
    voice: "af_heart"
    precision: "fp16"
    lifecycle: "dynamic_switch"    # Hoán đổi động, không chiếm VRAM vĩnh viễn
    preload: false                 # Khởi động không nạp VRAM
    init_target: "cpu"
    device_strategy: "auto"

  # 👁️ 3. Vision-Language Model (VLM / Qwen2.5-VL)
  # - Model nhỏ (<= 8B như Qwen 3B / 7B 4-bit): 1 GPU (GPU 0 hoặc GPU 1)
  # - Model lớn (>= 14B như Qwen 14B / 26B): 2 GPU chia tải động
  vlm:
    id: "Qwen/Qwen2.5-VL-3B-Instruct"
    quantization: "4bit"
    precision: "fp16"
    lifecycle: "dynamic_switch"    # Hoán đổi động
    preload: false                 # Khởi động không nạp VRAM
    init_target: "cpu"
    allocation_policy: "adaptive"  # 1 GPU nếu nhỏ, 2 GPU nếu lớn
    device_strategy: "auto"
    max_tokens: 512
    temperature: 0.7

  # 🖼️ 4. Text-to-Image & Inpainting (FLUX.1 SOTA FP16)
  # - Model nhỏ (FLUX schnell 4-bit): 1 GPU
  # - Model lớn (FLUX dev FP16 / full): 2 GPU chia tải động
  image:
    id: "black-forest-labs/FLUX.1-schnell"
    default_variant: "schnell"
    variants:
      schnell: "black-forest-labs/FLUX.1-schnell"
      dev: "black-forest-labs/FLUX.1-dev"
    quantization: "4bit"
    precision: "fp16"
    lifecycle: "dynamic_switch"
    preload: false
    init_target: "cpu"
    allocation_policy: "adaptive"  # 1 GPU cho schnell, 2 GPU cho dev
    device_strategy: "auto"
    steps: 4
    guidance: 0.0

  # 🎬 5. Text-to-Video & Image-to-Video (Wan2.1 SOTA FP16)
  video:
    id: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
    default_variant: "1.3b"
    fallback_id: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
    variants:
      t2v_1_3b: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
      t2v_14b: "Wan-AI/Wan2.1-T2V-14B-Diffusers"
      i2v_14b: "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"
    precision: "fp16"
    lifecycle: "dynamic_switch"
    preload: false
    init_target: "cpu"
    allocation_policy: "adaptive"
    device_strategy: "auto"
    num_frames: 17
    width: 832
    height: 480
    steps: 25
    guidance: 5.0


