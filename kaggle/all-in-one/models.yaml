# ==============================================================================
# 🎨 Kaggle All-in-One AI Studio: Declarative Model Configuration
# Dễ dàng thay đổi mô hình tại đây. Hệ thống tự động tính toán sơ đồ phân bổ GPU!
# ==============================================================================

models:
  # 👁️ 1. Vision-Language Model (VLM / Chat)
  # - Đổi sang model nhỏ (ví dụ "Qwen/Qwen2.5-VL-7B-Instruct"): Tự động gán vào GPU 0, giải phóng GPU 1 hoàn toàn.
  # - Đổi sang model lớn (ví dụ "Qwen/Qwen2.5-VL-26B-Instruct"): Tự động chia tải đều qua cả 2 GPU (Dual-GPU).
  vlm:
    id: "Qwen/Qwen2.5-VL-7B-Instruct"
    quantization: "4bit"
    device_strategy: "auto"
    max_tokens: 512
    temperature: 0.7

  # 🖼️ 2. Text-to-Image Generation (FLUX.1 SOTA 17 Tỷ tham số)
  image:
    id: "black-forest-labs/FLUX.1-schnell"
    quantization: "4bit"
    device_strategy: "gpu_1"
    steps: 4
    guidance: 0.0

  # 🎬 3. Text-to-Video Generation (Wan2.1-14B SOTA 14 Tỷ tham số)
  video:
    id: "Wan-AI/Wan2.1-T2V-14B-Diffusers"
    fallback_id: "Wan-AI/Wan2.1-T2V-1.3B-Diffusers"
    quantization: "4bit"
    device_strategy: "auto"
    num_frames: 25
    width: 768
    height: 512

  # 🎙️ 4. Speech-to-Text (Whisper Turbo Full FP16)
  stt:
    id: "openai/whisper-large-v3-turbo"
    precision: "fp16"
    device_strategy: "gpu_0"

  # 🔊 5. Text-to-Speech (Kokoro-82M Full FP16)
  tts:
    id: "hexgrad/Kokoro-82M"
    voice: "af_heart"
    precision: "fp16"
    device_strategy: "gpu_0"
