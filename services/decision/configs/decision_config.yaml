service_id: decision-service
name: "vLLM Decision Routing Engine"
host: "0.0.0.0"
port: 8082
static_domain: "decision.ai.example.com"
protocol: "http"

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  alias: "qwen-decision-8b"
  quantization: "none"
  precision: "bf16"
  max_context_tokens: 8192
  max_output_tokens: 2048

hardware:
  gpu_required: true
  gpu_device_index: 0
  min_vram_gb: 6.0
  allocation_policy: "single_gpu"

cors_origins:
  - "https://studio.ai.example.com"
  - "http://localhost:3000"
