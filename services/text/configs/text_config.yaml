service_id: text-service
name: "vLLM Text Generation Daemon"
host: "0.0.0.0"
port: 8080
static_domain: "text.ai.example.com"
protocol: "http"

model:
  name: "Qwen/Qwen2.5-7B-Instruct-AWQ"
  alias: "qwen-2.5-72b-instruct"
  quantization: "awq"
  precision: "fp16"
  max_context_tokens: 32768
  max_output_tokens: 4096

hardware:
  gpu_required: true
  gpu_device_index: 0
  min_vram_gb: 12.0
  allocation_policy: "single_gpu"

cors_origins:
  - "https://studio.ai.example.com"
  - "http://localhost:3000"
  - "*"
