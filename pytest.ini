[pytest]
pythonpath = . packages/contracts/src packages/auth/src packages/model-registry/src packages/client-sdk/python/src
testpaths = tests
norecursedirs = node_modules .git __pycache__ .next .agents
addopts = -ra -q
markers =
    tier1: Tier 1 Feature Coverage Tests
    tier2: Tier 2 Boundary and Corner Case Tests
    tier3: Tier 3 Cross-Feature Interaction Tests
    tier4: Tier 4 Real-World Application Scenario Tests
    security: Security and Authentication Tests
    ssrf: SSRF and Asset Validation Tests
    streaming: SSE and WebSocket Streaming Tests
    adversarial: Adversarial Hardening and Stress Tests
    studio_web: Studio Web cross-stack integration tests requiring node_modules
    contract_mock: In-process contract and mock simulation tests (does not count as live inference)
    live_e2e: Live end-to-end tests requiring real running clusters and real backends
